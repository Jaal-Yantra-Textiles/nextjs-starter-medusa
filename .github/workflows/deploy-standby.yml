name: Deploy standby origin (Cloudflare Containers)

# jyt#2636: keeps the Cloudflare standby on the same code as the AWS primary.
# Every push to main rebuilds the image for linux/amd64 (Containers' only
# architecture) on a native x86 runner and deploys the Worker + container.
#
# Secrets (repo settings):
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit, Containers:Edit, Workers
#                          Routes / zone DNS for sf-standby.jaalyantra.com
#   CLOUDFLARE_ACCOUNT_ID  c9b8b538…
#   ORIGIN_PROXY_SECRET, REVALIDATE_SECRET, STOREFRONT_REVALIDATE_SECRET
#                          same values as the AWS box (SSM /jyt/sf-origin/*)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-standby
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: deploy/standby
    env:
      # Until the token exists the standby is deployed by hand
      # (npm run deploy in deploy/standby); skip instead of failing red.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: No Cloudflare token yet
        if: env.HAS_TOKEN != 'true'
        working-directory: .
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; standby deploy skipped"

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22

      - name: Install wrangler
        if: env.HAS_TOKEN == 'true'
        run: npm ci

      - name: Deploy (builds the image from the repo-root Dockerfile)
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var GIT_SHA:${{ github.sha }}

      - name: Sync runtime secrets into the Worker
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN_PROXY_SECRET: ${{ secrets.ORIGIN_PROXY_SECRET }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          STOREFRONT_REVALIDATE_SECRET: ${{ secrets.STOREFRONT_REVALIDATE_SECRET }}
        run: |
          node -e 'const k=["ORIGIN_PROXY_SECRET","REVALIDATE_SECRET","STOREFRONT_REVALIDATE_SECRET"];const o={};for(const n of k){if(!process.env[n]){console.error("missing "+n);process.exit(1)}o[n]=process.env[n]}require("fs").writeFileSync("/tmp/s.json",JSON.stringify(o))'
          npx wrangler secret bulk /tmp/s.json
          rm -f /tmp/s.json
